app = "smart-shoe-store"
primary_region = "fra"

# Use Frankfurt (closest to Ethiopia)
# Other options: "lhr" (London), "cdg" (Paris)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_PATH = "/data/shop.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "teleshop_data"
  destination = "/data"